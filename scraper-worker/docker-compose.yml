services:
  scraper:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BROWSER_JOB_TIMEOUT_MS: ${BROWSER_JOB_TIMEOUT_MS:-55000}
      BROWSER_CLOSE_TIMEOUT_MS: ${BROWSER_CLOSE_TIMEOUT_MS:-5000}
      DNS_LOOKUP_TIMEOUT_MS: ${DNS_LOOKUP_TIMEOUT_MS:-3000}
      DNS_CACHE_TTL_MS: ${DNS_CACHE_TTL_MS:-30000}
    volumes:
      - scraper_screenshots:/var/lib/botlio-scraper/screenshots
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 512mb
    mem_limit: 1200m
    cpus: 1.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - scraper
      - lead_runner
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Google Maps stays private on the Docker network. Only the small lead
  # gateway is reachable through Caddy and it requires an HMAC signature.
  maps:
    # The project's own documented Docker image. Set MAPS_SCRAPER_IMAGE to a
    # tested version tag in .env before a future upgrade.
    image: ${MAPS_SCRAPER_IMAGE:-gosom/google-maps-scraper}
    restart: unless-stopped
    command: ["-web", "-addr", ":8080", "-data-folder", "/data", "-c", "1", "-browser-pool-size", "1", "-pages-per-browser", "1"]
    volumes:
      - maps_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1800m
    cpus: 1.0

  lead_runner:
    build: ../lead-worker
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3100
      MAPS_API_URL: http://maps:8080
      LEAD_WORKER_DATA_DIR: /var/lib/botlio-leads
    volumes:
      - lead_worker_data:/var/lib/botlio-leads
    depends_on:
      - maps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 300m
    cpus: 0.35

volumes:
  scraper_screenshots:
  caddy_data:
  caddy_config:
  maps_data:
  lead_worker_data:
