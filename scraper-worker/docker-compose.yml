services:
  scraper:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - scraper_screenshots:/var/lib/botlio-scraper/screenshots
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - scraper
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scraper_screenshots:
  caddy_data:
  caddy_config:
